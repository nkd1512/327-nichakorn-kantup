name: Quasar Deploy to GitHub Pages

on:
  push:
    branches:
      - cicd # กำหนดให้ Workflow นี้รันเมื่อมีการ Push ไปที่สาขา 'cicd'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    # ต้องกำหนดสิทธิ์เพื่ออนุญาตให้ Action เขียนไปยัง gh-pages branch ได้
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # จำเป็นต้อง Fetch ประวัติทั้งหมดเพื่อให้ peaceiris/actions-gh-pages ทำงานได้ถูกต้อง
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ใช้ Node.js เวอร์ชัน 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install
        
      # 🔴 ลบขั้นตอนการ Run tests ออกไปชั่วคราวเพื่อเลี่ยง Playwright Error
      
      - name: Build Quasar App
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/spa # โฟลเดอร์ที่ Quasar Build เสร็จแล้ว
          publish_branch: gh-pages # สาขาเป้าหมายสำหรับการ Deploy
          force_orphan: true # เพื่อให้มั่นใจว่า gh-pages จะมีแต่โค้ด Build ล่าสุด
